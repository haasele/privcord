# Synapse generic_worker pool - scale with worker-autoscaler
# Uses generated synapse-worker-config ConfigMap (run generate_manifests.py first).
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: synapse-workers
  namespace: matrix-stack
spec:
  serviceName: synapse-workers
  replicas: 1
  selector:
    matchLabels:
      app: synapse-workers
  template:
    metadata:
      labels:
        app: synapse-workers
    spec:
      containers:
        - name: worker
          image: synapse-discordify:latest
          command:
            - /bin/sh
            - -c
            - |
              ORDINAL="${HOSTNAME##*-}"
              export WORKER_NAME="generic_worker_${ORDINAL:-0}"
              exec synapse_worker /config/worker.yaml
          ports:
            - containerPort: 8083
          env:
            - name: HOSTNAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
            - name: data
              mountPath: /data
            - name: signing-key
              mountPath: /data/signing.key
              subPath: signing.key
              readOnly: true
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "1Gi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /_matrix/client/versions
              port: 8083
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /_matrix/client/versions
              port: 8083
            initialDelaySeconds: 10
            periodSeconds: 5
      volumes:
        - name: config
          configMap:
            name: synapse-worker-config
        - name: data
          emptyDir: {}
        - name: signing-key
          secret:
            secretName: synapse-signing-key
---
apiVersion: v1
kind: Service
metadata:
  name: synapse-workers
  namespace: matrix-stack
spec:
  ports:
    - name: http
      port: 8083
      targetPort: 8083
  selector:
    app: synapse-workers
  clusterIP: None
---
# Headless for StatefulSet; optional ClusterIP for routing if you put a proxy in front
apiVersion: v1
kind: Service
metadata:
  name: synapse-workers-lb
  namespace: matrix-stack
spec:
  ports:
    - name: http
      port: 8083
      targetPort: 8083
  selector:
    app: synapse-workers
