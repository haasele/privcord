apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres-media
  namespace: matrix-stack
spec:
  serviceName: postgres-media
  replicas: 1
  selector:
    matchLabels:
      app: postgres-media
  template:
    metadata:
      labels:
        app: postgres-media
    spec:
      containers:
        - name: postgres
          image: postgres:15-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: synapse_media
            - name: POSTGRES_USER
              value: synapse_media
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-media-credentials
                  key: password
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "1Gi"
              cpu: "500m"
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "synapse_media"]
            initialDelaySeconds: 30
            periodSeconds: 10
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: postgres-media-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-media-data
  namespace: matrix-stack
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 20Gi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-media
  namespace: matrix-stack
spec:
  ports:
    - port: 5432
      targetPort: 5432
      name: postgres
  selector:
    app: postgres-media
  clusterIP: None
