# TURN server (coturn) for WebRTC NAT traversal
apiVersion: v1
kind: ConfigMap
metadata:
  name: turn-config
  namespace: matrix-stack
data:
  turnserver.conf: |
    listening-port=3478
    tls-listening-port=5349
    realm=matrix-stack.local
    server-name=matrix-stack
    lt-cred-mech
    use-auth-secret
    # static-auth-secret is set via env
    no-multicast
    no-cli
    no-tlsv1
    no-tlsv1_1
    verbose
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: turn
  namespace: matrix-stack
spec:
  replicas: 1
  selector:
    matchLabels:
      app: turn
  template:
    metadata:
      labels:
        app: turn
    spec:
      containers:
        - name: turn
          image: coturn/coturn:latest
          ports:
            - containerPort: 3478
              name: udp
              protocol: UDP
            - containerPort: 3478
              name: tcp
            - containerPort: 5349
              name: tls
          env:
            - name: TURN_SECRET
              valueFrom:
                secretKeyRef:
                  name: turn-credentials
                  key: shared_secret
          args:
            - -c
            - /etc/coturn/turnserver.conf
          volumeMounts:
            - name: config
              mountPath: /etc/coturn
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "200m"
      volumes:
        - name: config
          configMap:
            name: turn-config
---
apiVersion: v1
kind: Service
metadata:
  name: turn
  namespace: matrix-stack
spec:
  ports:
    - name: udp
      port: 3478
      targetPort: 3478
      protocol: UDP
    - name: tcp
      port: 3478
      targetPort: 3478
    - name: tls
      port: 5349
      targetPort: 5349
  selector:
    app: turn
