# Element Call - WebRTC calling frontend (connects to Synapse + LiveKit)
# Image: element call or element-call docker image
apiVersion: apps/v1
kind: Deployment
metadata:
  name: element-call
  namespace: matrix-stack
spec:
  replicas: 1
  selector:
    matchLabels:
      app: element-call
  template:
    metadata:
      labels:
        app: element-call
    spec:
      containers:
        - name: element-call
          image: ghcr.io/element-hq/element-call:latest
          ports:
            - containerPort: 80
          env:
            - name: HOMESERVER_URL
              valueFrom:
                configMapKeyRef:
                  name: stack-env
                  key: HOMESERVER_URL
            - name: LIVEKIT_URL
              valueFrom:
                configMapKeyRef:
                  name: stack-env
                  key: LIVEKIT_WS_URL
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "200m"
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: element-call
  namespace: matrix-stack
spec:
  ports:
    - port: 80
      targetPort: 80
      name: http
  selector:
    app: element-call
