# Copy to secrets.yaml and fill values (or use external secrets / sealed-secrets).
# DO NOT commit secrets.yaml.
---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-main-credentials
  namespace: matrix-stack
type: Opaque
stringData:
  password: ""  # POSTGRES_MAIN_PASSWORD
  replication_password: ""  # For streaming replica (postgres-main-replica)
---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-media-credentials
  namespace: matrix-stack
type: Opaque
stringData:
  password: ""  # POSTGRES_MEDIA_PASSWORD
---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-metadata-credentials
  namespace: matrix-stack
type: Opaque
stringData:
  password: ""  # POSTGRES_METADATA_PASSWORD (backend jobs, app metadata)
---
# Only if postgres_federated.enabled is true
apiVersion: v1
kind: Secret
metadata:
  name: postgres-federated-credentials
  namespace: matrix-stack
type: Opaque
stringData:
  password: ""  # POSTGRES_FEDERATED_PASSWORD
---
apiVersion: v1
kind: Secret
metadata:
  name: redis-credentials
  namespace: matrix-stack
type: Opaque
stringData:
  password: ""  # REDIS_PASSWORD (optional)
---
apiVersion: v1
kind: Secret
metadata:
  name: synapse-secrets
  namespace: matrix-stack
type: Opaque
stringData:
  registration_shared_secret: ""
  signing_key: ""  # base64 or raw; mounted as signing.key
  macaroon_secret_key: ""
---
# Signing key for Synapse main + workers (key must be named signing.key)
apiVersion: v1
kind: Secret
metadata:
  name: synapse-signing-key
  namespace: matrix-stack
type: Opaque
stringData:
  signing.key: ""  # Same content as synapse signing key file
---
apiVersion: v1
kind: Secret
metadata:
  name: turn-credentials
  namespace: matrix-stack
type: Opaque
stringData:
  shared_secret: ""
---
apiVersion: v1
kind: Secret
metadata:
  name: livekit-credentials
  namespace: matrix-stack
type: Opaque
stringData:
  api_key: ""
  api_secret: ""
