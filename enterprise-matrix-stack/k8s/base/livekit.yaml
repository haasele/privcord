# LiveKit SFU - used by Element Call for voice/video
# Ref: https://docs.livekit.io/home/self-hosting/kubernetes
apiVersion: apps/v1
kind: Deployment
metadata:
  name: livekit
  namespace: matrix-stack
spec:
  replicas: 1
  selector:
    matchLabels:
      app: livekit
  template:
    metadata:
      labels:
        app: livekit
    spec:
      containers:
        - name: livekit
          image: livekit/livekit-server:latest
          args:
            - --config
            - /etc/livekit.yaml
          ports:
            - containerPort: 7880
            - containerPort: 7881
          env:
            - name: LIVEKIT_KEYS
              valueFrom:
                secretKeyRef:
                  name: livekit-credentials
                  key: api_key
            - name: LIVEKIT_SECRET
              valueFrom:
                secretKeyRef:
                  name: livekit-credentials
                  key: api_secret
          volumeMounts:
            - name: config
              mountPath: /etc/livekit.yaml
              subPath: livekit.yaml
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "1Gi"
              cpu: "1"
          # LiveKit often needs hostNetwork for WebRTC; adjust per docs
          # securityContext:
          #   capabilities:
          #     add: ["NET_BIND_SERVICE"]
      volumes:
        - name: config
          configMap:
            name: livekit-config
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: livekit-config
  namespace: matrix-stack
data:
  livekit.yaml: |
    port: 7880
    rtc:
      tcp_port: 7881
      use_external_ip: true
    redis:
      address: redis:6379
    keys:
      # In production these come from Secret; placeholder
      API_KEY: changeme
      API_SECRET: changeme
---
apiVersion: v1
kind: Service
metadata:
  name: livekit
  namespace: matrix-stack
spec:
  ports:
    - name: http
      port: 7880
      targetPort: 7880
    - name: rtc
      port: 7881
      targetPort: 7881
  selector:
    app: livekit
