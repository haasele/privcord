# ConfigMap for Postgres primary: replication settings and init script for replication user.
# Used by postgres-main (primary) and postgres-main-replica (standby).
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-main-config
  namespace: matrix-stack
data:
  create-replication-user.sh: |
    #!/bin/sh
    set -e
    if [ -z "$REPLICATION_PASSWORD" ]; then
      echo "REPLICATION_PASSWORD not set, skipping replication user"
      exit 0
    fi
    psql -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d postgres -c \
      "DO \$\$ BEGIN IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'replicator') THEN CREATE USER replicator WITH REPLICATION PASSWORD '"'"'${REPLICATION_PASSWORD}'"'"'; END IF; END \$\$;"
